[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-cli-tofu"
version = "0.0.1.dev0"
description = "Command line interface to talk to pulpcore's REST API. (Tofu plugin commands)"
readme = "README.md"
keywords = ["pulp", "pulp-cli", "opentofu", "terraform", "provider-registry", "module-registry"]
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
  {name = "Chad Loder", email = "26261238+chad-loder@users.noreply.github.com"},
]
classifiers=[
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]
dependencies = [
  "pulp-cli>=0.41.1,<0.42",
  "pulp-glue-tofu==0.0.1.dev0",
]

[project.urls]
repository = "https://github.com/chad-loder/pulp-cli-tofu"
changelog = "https://github.com/chad-loder/pulp-cli-tofu/blob/main/CHANGES.md"

[project.entry-points."pulp_cli.plugins"]
tofu = "pulpcore.cli.tofu"

[tool.pulp_cli_template]
# This section is co-managed by the cookiecutter templates.
# Changes to existing keys should be preserved.
app_label = "tofu"
src_layout = true
repository = "https://github.com/chad-loder/pulp-cli-tofu"
glue = true
docs = true
translations = false
main_package = "tofu"
binary_dependencies = ""
unittests = false
paralleltests = false

[tool.pytest.ini_options]
markers = [
  "script: tests provided as shell scripts",
  "help_page: tests that render help pages",
  "pulp_tofu: pulp_tofu tests",
]

[tool.uv.sources]
# This section is managed by the cookiecutter templates.
pulp-glue-tofu = { workspace = true }
pulp-docs = { git = "https://github.com/pulp/pulp-docs" }

[tool.uv.workspace]
# This section is managed by the cookiecutter templates.
members = ["pulp-glue-tofu"]

[tool.uv.dependency-groups]
# This section is managed by the cookiecutter templates.
docs = {requires-python = ">=3.11"}

[tool.uv.build-backend]
# This section is managed by the cookiecutter templates.
module-name = ["pulpcore.cli"]
namespace = true
source-exclude = ["*.pot", "*.po", "**/*\\~"]


[tool.setuptools.packages.find]
# This section is managed by the cookiecutter templates.
where = ["src"]
include = ["pulpcore.cli.*"]
namespaces = true

[tool.setuptools.package-data]
# This section is managed by the cookiecutter templates.
"*" = ["py.typed"]


[tool.bumpversion]
# This section is managed by the cookiecutter templates.
current_version = "0.0.1.dev0"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.(?P<release>[a-z]+))?"
serialize = [
  "{major}.{minor}.{patch}.{release}",
  "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
# This section is managed by the cookiecutter templates.
optional_value = "prod"
values = [
  "dev",
  "prod",
]

[[tool.bumpversion.files]]
# This section is managed by the cookiecutter templates.
filename = "./pulp-glue-tofu/src/pulp_glue/tofu/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
# This section is managed by the cookiecutter templates.
filename = "./src/pulpcore/cli/tofu/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
# This section is managed by the cookiecutter templates.
filename = "./pulp-glue-tofu/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
# This section is managed by the cookiecutter templates.
filename = "./pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
# This section is managed by the cookiecutter templates.
filename = "./pyproject.toml"
search = "\"pulp-glue-tofu=={current_version}\""
replace = "\"pulp-glue-tofu=={new_version}\""


[tool.towncrier]
# This section is managed by the cookiecutter templates.
filename = "CHANGES.md"
directory = "CHANGES/"
title_format = "## {version} ({project_date}) {{: #{version} }}"
template = "CHANGES/.TEMPLATE.md"
issue_format = "[#{issue}](https://github.com/chad-loder/pulp-cli-tofu/issues/{issue})"
start_string = "[//]: # (towncrier release notes start)\n"
underlines = ["", "", ""]

[[tool.towncrier.section]]
# This section is managed by the cookiecutter templates.
path = ""
name = ""

[[tool.towncrier.section]]
# This section is managed by the cookiecutter templates.
path = "pulp-glue-tofu"
name = "Pulp-tofu GLUE"

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "devel"
name = "Developer Notes"
showcontent = true

[[tool.towncrier.type]]
# This section is managed by the cookiecutter templates.
directory = "misc"
name = "Misc"
showcontent = true


[tool.ruff]
# This section is managed by the cookiecutter templates.
line-length = 100

[tool.ruff.lint]
# This section is managed by the cookiecutter templates.
select = ["E4", "E7", "E9", "F"]
extend-select = ["FURB", "I", "INT", "PTH", "SIM1", "TID", "T10", "UP"]

[tool.ruff.lint.isort]
# This section is managed by the cookiecutter templates.
sections = { second-party = ["pulp_glue"] }
section-order = ["future", "standard-library", "third-party", "second-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# This section is managed by the cookiecutter templates.
"distutils".msg = "The 'distutils' module has been deprecated since Python 3.9."
"pulpcore.cli.common.generic".msg = "This module moved to 'pulp_cli.generic'."


[tool.mypy]
# This section is managed by the cookiecutter templates.
strict = true
warn_unused_ignores = false
show_error_codes = true
files = "src/**/*.py, tests/**/*.py"
mypy_path = ["src", "pulp-glue-tofu/src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# This section is managed by the cookiecutter templates.
module = [
  "click_shell.*",
  "gnupg.*",
  "IPython.*",
  "schema.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
  {include-group = "lint"},
  "pylsp-mypy>=0.7.0",
  "pylsp-rope>=0.1.17,<0.1.18",
]
lint = [
  {include-group = "test"},
  "mypy~=1.20.0",
  "ruff~=0.16.0",
  "shellcheck-py~=0.11.0.1",
  "types-pygments",
  "types-pyyaml",
  "types-requests",
  "types-setuptools",
  "types-toml",
]
test = [
  "pygments>=2.19.2",
  "pytest>=7.0.0,<9.2",
  "pytest-xdist>=3.8.0,<3.9",
  "python-gnupg>=0.5.0,<0.6",
  "secretstorage>=3.5.0",
  "trustme>=1.1.0,<1.3",
]
docs = [
  "pulp-docs",
]
